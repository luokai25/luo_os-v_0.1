name: Build & Release Luo OS APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Luo OS APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Accept SDK licenses
        run: |
          mkdir -p $ANDROID_HOME/licenses
          printf "24333f8a63b6825ea9c5514f83c2829b004d1fee\nd56f5187479451eabf01fb78af6dfcb131a6481e\n" \
            > $ANDROID_HOME/licenses/android-sdk-license
          printf "84831b9409646a918e30573bab4c9c91346d8abd\n" \
            > $ANDROID_HOME/licenses/android-sdk-preview-license

      - name: Install SDK
        run: |
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-34" "build-tools;34.0.0" 2>&1 | tail -3

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      # Fetch the bundled AI model BEFORE the Gradle build, so it's already in
      # assets/models/ when packageDebug runs. Cached by filename so repeat
      # releases don't re-download 555 MB unless the model URL changes.
      # Hard-fails the whole job if the download is missing, too small, or the
      # source is unreachable — a silent bad download here is exactly the bug
      # that shipped a broken APK before.
      - name: Cache bundled model
        id: cache-model
        uses: actions/cache@v4
        with:
          path: android/app/src/main/assets/models/gemma3-1b-it-int4.task
          key: gemma3-1b-it-int4-task-v1

      - name: Fetch bundled model (Gemma 3 1B-IT, ~555 MB)
        if: steps.cache-model.outputs.cache-hit != 'true'
        run: |
          set -e
          MODEL_DIR="android/app/src/main/assets/models"
          MODEL_FILE="$MODEL_DIR/gemma3-1b-it-int4.task"
          MODEL_URL="https://huggingface.co/Usern123454321/custom_model.task/resolve/main/gemma3-1b-it-int4.task"

          mkdir -p "$MODEL_DIR"
          echo "Downloading model from $MODEL_URL ..."
          curl -fSL --retry 3 --retry-delay 5 \
               -o "$MODEL_FILE" \
               "$MODEL_URL"

      - name: Verify model file size
        run: |
          MODEL_FILE="android/app/src/main/assets/models/gemma3-1b-it-int4.task"
          MIN_SIZE_BYTES=400000000   # ~400 MB floor; real file is ~555 MB

          if [ ! -f "$MODEL_FILE" ]; then
            echo "::error::Model file is missing entirely at $MODEL_FILE. Aborting build."
            exit 1
          fi

          ACTUAL_SIZE=$(stat -c%s "$MODEL_FILE" 2>/dev/null || stat -f%z "$MODEL_FILE")
          echo "Model file size: $ACTUAL_SIZE bytes"

          if [ "$ACTUAL_SIZE" -lt "$MIN_SIZE_BYTES" ]; then
            echo "::error::Model file is only $ACTUAL_SIZE bytes (expected >= $MIN_SIZE_BYTES). Aborting build — a broken/undersized model must never be packaged."
            exit 1
          fi

          echo "✓ Model file size-verified ($ACTUAL_SIZE bytes)"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle*', 'android/**/libs.versions.toml') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Build Debug APK
        working-directory: android
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace --no-daemon --console=plain > /tmp/gradle.log 2>&1

      - name: Verify build actually succeeded
        id: build
        run: |
          # A previous run showed steps.build.outputs.ok reporting '0' (success)
          # even though the real Gradle log said "BUILD FAILED" — a
          # continue-on-error step's custom $GITHUB_OUTPUT write apparently
          # isn't reliable when the underlying command genuinely fails.
          # Checking the actual log text is unambiguous ground truth instead.
          if grep -q "BUILD SUCCESSFUL" /tmp/gradle.log; then
            echo "ok=0" >> "$GITHUB_OUTPUT"
          else
            echo "ok=1" >> "$GITHUB_OUTPUT"
            echo "::error::Gradle build did not report BUILD SUCCESSFUL — treating as failed."
          fi

      - name: Fail if build failed
        if: steps.build.outputs.ok != '0'
        run: exit 1

      - name: Find APK
        id: findapk
        continue-on-error: true
        run: |
          VERSION="${GITHUB_REF_NAME:-dev}"
          mkdir -p release_output
          {
            echo "pwd: $(pwd)"
            echo "Contents of android/app/build/outputs (if exists):"
            find android/app/build/outputs -maxdepth 4 2>&1 || echo "(outputs dir missing)"
          } | tee /tmp/findapk.log
          APK=$(find android/app/build/outputs/apk -name "*.apk" -type f | head -1)
          if [ -z "$APK" ]; then
            echo "ok=1" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          cp "$APK" "release_output/LuoOS-${VERSION}.apk"
          echo "APK_PATH=release_output/LuoOS-${VERSION}.apk" >> $GITHUB_ENV
          echo "APK_NAME=LuoOS-${VERSION}.apk" >> $GITHUB_ENV
          ls -lh "release_output/LuoOS-${VERSION}.apk"
          echo "ok=0" >> "$GITHUB_OUTPUT"

      - name: Publish all diagnostic logs (always, single commit)
        if: always()
        run: |
          cd /tmp
          rm -rf logrepo
          git clone "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" logrepo
          cd logrepo
          git config user.email "ci@luoos.build"
          git config user.name "Luo OS CI"
          git checkout --orphan ci-debug-logs-new 2>/dev/null
          git rm -rf . 2>/dev/null || true
          cp /tmp/gradle.log ./build-full.log 2>/dev/null || echo "(missing)" > ./build-full.log
          cp /tmp/findapk.log ./findapk.log 2>/dev/null || echo "(missing)" > ./findapk.log
          git add -A
          git commit -m "CI logs from run ${{ github.run_id }}"
          git branch -M ci-debug-logs-new ci-debug-logs
          git push origin ci-debug-logs --force

      - name: Fail if APK not found
        if: steps.findapk.outputs.ok == '1'
        run: exit 1

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}
          path: ${{ env.APK_PATH }}
          retention-days: 90

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: "Luo OS ${{ github.ref_name }}"
          body: |
            ## ⚡ Luo OS ${{ github.ref_name }}

            AI-native Android OS powered by **Gemma 3 1B-IT** — bundled inside the app,
            fully offline from the moment you install it. No download step, no waiting.

            ---

            ### 📲 Install
            1. Download `${{ env.APK_NAME }}` below (~600 MB — this is a large file since
               the AI model ships inside it)
            2. On your phone: **Settings → Security → Install unknown apps** → allow your file manager
            3. Tap the APK → **Install**
            4. Open **Luo OS** → the model sets itself up automatically on first launch
               (a few seconds, one time only) → go to **Shell** → start talking

            ---

            ### Requirements
            - Android 12+ (API 31)
            - arm64 device (Snapdragon, Dimensity, Exynos — **not x86**)
            - 6 GB+ RAM
            - ~1.5 GB free storage (model + app data)

            **Tested on:** Poco X3 NFC · Snapdragon 732G · 8 GB RAM

            ---

            > 💡 Everything is bundled — the whole APK download IS the model download.
            > After install, Luo OS never needs the network for AI responses.
          files: ${{ env.APK_PATH }}
          draft: false
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
