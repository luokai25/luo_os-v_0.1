name: Build & Release Luo OS APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Luo OS APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Accept SDK licenses
        run: |
          mkdir -p $ANDROID_HOME/licenses
          printf "24333f8a63b6825ea9c5514f83c2829b004d1fee\nd56f5187479451eabf01fb78af6dfcb131a6481e\n" \
            > $ANDROID_HOME/licenses/android-sdk-license
          printf "84831b9409646a918e30573bab4c9c91346d8abd\n" \
            > $ANDROID_HOME/licenses/android-sdk-preview-license

      - name: Install SDK
        run: |
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-34" "build-tools;34.0.0" 2>&1 | tail -3

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle*', 'android/**/libs.versions.toml') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Build Debug APK
        id: build
        working-directory: android
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace --no-daemon > /tmp/gradle.log 2>&1
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Publish log to debug branch (on failure)
        if: steps.build.outputs.exit_code != '0'
        run: |
          git config user.email "ci@luoos.build"
          git config user.name "Luo OS CI"
          cd /tmp
          rm -rf logrepo
          git clone "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" logrepo
          cd logrepo
          git checkout --orphan ci-debug-logs 2>/dev/null || git checkout ci-debug-logs
          git rm -rf . 2>/dev/null || true
          cp /tmp/gradle.log ./gradle-error.log
          git add gradle-error.log
          git commit -m "CI build log from run ${{ github.run_id }}"
          git push origin ci-debug-logs --force

      - name: Fail job if build failed
        if: steps.build.outputs.exit_code != '0'
        run: exit 1

      - name: Find APK
        run: |
          VERSION="${GITHUB_REF_NAME:-dev}"
          mkdir -p release_output
          APK=$(find android/app/build/outputs/apk/debug -name "*.apk" | head -1)
          cp "$APK" "release_output/LuoOS-${VERSION}.apk"
          echo "APK_PATH=release_output/LuoOS-${VERSION}.apk" >> $GITHUB_ENV
          echo "APK_NAME=LuoOS-${VERSION}.apk" >> $GITHUB_ENV
          ls -lh "release_output/LuoOS-${VERSION}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}
          path: ${{ env.APK_PATH }}
          retention-days: 90

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: "Luo OS ${{ github.ref_name }}"
          body: |
            ## ⚡ Luo OS ${{ github.ref_name }}
            AI-native Android OS — Gemma 4 E2B-it, fully offline.

            ### 📲 Install
            1. Download `${{ env.APK_NAME }}` below
            2. Settings → Security → Install unknown apps → enable
            3. Tap APK → Install
            4. Open Luo OS → Settings → Download model (~1.3 GB, WiFi)
            5. Wait ~20 sec → Shell → talk to Luo

            **Requirements:** Android 12+ · arm64 · 6 GB+ RAM · ~2 GB storage
          files: ${{ env.APK_PATH }}
          draft: false
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
