name: Build & Release Luo OS APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build Luo OS APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Accept Android SDK licenses
        run: |
          mkdir -p $ANDROID_HOME/licenses
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > $ANDROID_HOME/licenses/android-sdk-license
          echo "84831b9409646a918e30573bab4c9c91346d8abd" >> $ANDROID_HOME/licenses/android-sdk-license
          echo "d975f751698a77b662f1254ddbeed3901e976f5a" > $ANDROID_HOME/licenses/android-sdk-preview-license

      - name: Install SDK build-tools and platform
        run: |
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "platform-tools"

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties', 'android/**/libs.versions.toml') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Build Debug APK
        working-directory: android
        run: |
          ./gradlew assembleDebug --stacktrace --no-daemon 2>&1
        env:
          GRADLE_OPTS: "-Xmx4g -XX:MaxMetaspaceSize=512m"

      - name: Find and rename APK
        run: |
          VERSION="${GITHUB_REF_NAME:-dev}"
          mkdir -p release_output
          APK=$(find android/app/build/outputs/apk/debug -name "*.apk" | head -1)
          echo "Found APK: $APK ($(du -sh "$APK" | cut -f1))"
          cp "$APK" "release_output/LuoOS-${VERSION}.apk"
          echo "APK_PATH=release_output/LuoOS-${VERSION}.apk" >> $GITHUB_ENV
          echo "APK_NAME=LuoOS-${VERSION}.apk" >> $GITHUB_ENV

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}
          path: ${{ env.APK_PATH }}
          retention-days: 90

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: "Luo OS ${{ github.ref_name }}"
          body: |
            ## ⚡ Luo OS ${{ github.ref_name }}

            AI-native Android OS with **Gemma 4 E2B-it** running fully offline on your device.

            ---

            ### 📲 How to install
            1. Download `${{ env.APK_NAME }}` below
            2. On your phone: **Settings → Security → Install unknown apps** → allow your file manager
            3. Tap the downloaded APK → **Install**
            4. Open **Luo OS** → go to **Settings** → tap **Download** (Gemma 4 E2B, ~1.3 GB — use WiFi)
            5. Wait ~15–20 sec for model to load → go to **Shell** → start talking

            ---

            ### Requirements
            - Android 12+ (API 31)
            - arm64 device (Snapdragon / Dimensity / Exynos — **not x86**)
            - 6 GB+ RAM
            - ~2 GB free storage

            **Tested on:** Poco X3 NFC · Snapdragon 732G · 8 GB RAM

            > 💡 After the model downloads (~1.3 GB), Luo OS is **100% offline**. No cloud, no subscription.
          files: ${{ env.APK_PATH }}
          draft: false
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
