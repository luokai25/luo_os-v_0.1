  // Treat as search — open in browser
  openApp('browser');
  setTimeout(() => { const u = document.getElementById('browser-url'); if(u){u.value='https://youtube.com/results?search_query='+encodeURIComponent(val); browserGo();} }, 400);
}

// ── CALCULATOR ────────────────────────────────────────────────
let _calcExpr = '', _calcResult = '0', _calcJustEvaled = false;

function calcPress(k) {
  const disp = document.getElementById('calc-display');
  const expr = document.getElementById('calc-expr');
  if (k === 'AC') { _calcExpr=''; _calcResult='0'; _calcJustEvaled=false; }
  else if (k === '±') { _calcResult = _calcResult.startsWith('-') ? _calcResult.slice(1) : '-'+_calcResult; }
  else if (k === '%') { _calcResult = String(parseFloat(_calcResult)/100); }
  else if (k === '=') {
    try {
      const safe = _calcExpr.replace(/÷/g,'/').replace(/×/g,'*').replace(/−/g,'-');
      _calcResult = String(eval(safe + _calcResult));
      if (expr) expr.textContent = _calcExpr + _calcResult + ' =';
      _calcExpr=''; _calcJustEvaled=true;
    } catch { _calcResult='Error'; }
  } else if (['+','−','×','÷'].includes(k)) {
    _calcExpr += _calcResult + k; _calcResult='0'; _calcJustEvaled=false;
  } else {
    if (_calcJustEvaled) { _calcExpr=''; _calcJustEvaled=false; }
    _calcResult = _calcResult==='0'||_calcResult==='-0' ? k : _calcResult+k;
  }
  if (disp) disp.textContent = _calcResult.length > 9 ? parseFloat(_calcResult).toExponential(3) : _calcResult;
  if (expr && k!=='=') expr.textContent = _calcExpr;
}

// ── CALENDAR ─────────────────────────────────────────────────
let _calDate = new Date(), _calEvents = JSON.parse(localStorage.getItem('luo-cal-events')||'{}');
const _months = ['January','February','March','April','May','June','July','August','September','October','November','December'];

function calUpdateSidebarBadge() {
  const today = new Date();
  const key = `${today.getFullYear()}-${today.getMonth()+1}-${today.getDate()}`;
  const count = (_calEvents[key]||[]).length;
  const sbBtn = document.querySelector('[onclick*="openApp('calendar')"] .sb-badge') ||
                (() => {
                  const btn = document.querySelector('[onclick*="openApp('calendar')"]');
                  if (!btn) return null;
                  let badge = btn.querySelector('.sb-badge');
                  if (!badge) { badge = document.createElement('span'); badge.className='sb-badge';
                    badge.style.cssText='position:absolute;top:4px;right:4px;background:var(--accent);color:#000;border-radius:50%;width:14px;height:14px;font-size:8px;display:flex;align-items:center;justify-content:center;font-weight:700';
                    btn.style.position='relative'; btn.appendChild(badge); }
                  return badge;
                })();
  if (sbBtn) sbBtn.textContent = count > 0 ? count : '';
}

function calRender() {
  const label = document.getElementById('cal-month-label');
  const grid  = document.getElementById('cal-grid');
  if (!label || !grid) return;
  label.textContent = `${_months[_calDate.getMonth()]} ${_calDate.getFullYear()}`;
  const first = new Date(_calDate.getFullYear(), _calDate.getMonth(), 1).getDay();
  const days  = new Date(_calDate.getFullYear(), _calDate.getMonth()+1, 0).getDate();
  const today = new Date();
  let html = '';
  for (let i=0; i<first; i++) html += `<div style="background:var(--bg-desktop)"></div>`;
  for (let d=1; d<=days; d++) {
    const key = `${_calDate.getFullYear()}-${_calDate.getMonth()+1}-${d}`;
    const isToday = d===today.getDate() && _calDate.getMonth()===today.getMonth() && _calDate.getFullYear()===today.getFullYear();
    const hasEv = _calEvents[key]?.length > 0;
    html += `<div onclick="calDayClick(${d})" style="padding:8px 6px;background:var(--bg-desktop);text-align:center;cursor:pointer;transition:background .15s;position:relative;border:1px solid var(--border);min-height:60px" onmouseover="this.style.background='var(--bg-card)'" onmouseout="this.style.background='var(--bg-desktop)'">
      <span style="font-size:13px;${isToday?'background:var(--accent);color:#000;border-radius:50%;padding:2px 6px;font-weight:700':''}">${d}</span>
      ${hasEv?`<div style="width:5px;height:5px;background:var(--accent2);border-radius:50%;margin:3px auto 0"></div>`:''}
    </div>`;
  }
  grid.innerHTML = html;
}

function calNav(dir) { _calDate.setMonth(_calDate.getMonth()+dir); calRender(); }
function calToday() { _calDate = new Date(); calRender(); }

function calDayClick(d) {
  const key = `${_calDate.getFullYear()}-${_calDate.getMonth()+1}-${d}`;
  const label = document.getElementById('cal-events-label');
  const list  = document.getElementById('cal-events-list');
  if (label) label.textContent = `${_months[_calDate.getMonth()]} ${d} — ${_calDate.getFullYear()}`;
  const evs = _calEvents[key] || [];
  if (list) list.innerHTML = evs.map((e,i)=>`
    <div style="display:flex;align-items:center;gap:6px;padding:4px 8px;background:var(--bg-card);border:1px solid var(--border);border-radius:6px;font-size:11px">
      <span style="width:6px;height:6px;border-radius:50%;background:var(--accent2);flex-shrink:0"></span>
      ${e}
      <button onclick="calDeleteEvent('${key}',${i})" style="background:none;border:none;color:var(--text3);cursor:pointer;margin-left:auto;font-size:12px">✕</button>
    </div>`).join('') +
    `<button onclick="calAddEvent('${key}')" style="padding:4px 10px;background:var(--accent);color:#000;border:none;border-radius:6px;font-size:11px;cursor:pointer;font-weight:700">+ Add</button>`;
}

function calAddEvent(key) {
  const ev = prompt('Event:'); if (!ev) return;
  if (!_calEvents[key]) _calEvents[key]=[];
  _calEvents[key].push(ev);
  localStorage.setItem('luo-cal-events', JSON.stringify(_calEvents));
  calRender(); calDayClick(parseInt(key.split('-')[2]));
}

function calDeleteEvent(key, idx) {
  _calEvents[key].splice(idx,1);
  if (!_calEvents[key].length) delete _calEvents[key];
  localStorage.setItem('luo-cal-events', JSON.stringify(_calEvents));
  calRender(); calDayClick(parseInt(key.split('-')[2]));
}

// ── FILE MANAGER ──────────────────────────────────────────────
let _filesPath = '~', _filesHistory = [], _filesHistPos = -1;

async function filesNav(path) {
  if (!path) return;
  _filesHistory = _filesHistory.slice(0, _filesHistPos+1);
  _filesHistory.push(path); _filesHistPos++;
  _filesPath = path;
  const pb = document.getElementById('files-path-bar');
  if (pb) pb.value = path;
  const grid = document.getElementById('files-grid');
  const stat = document.getElementById('files-status');
  if (grid) grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:30px;color:var(--text3)">Loading...</div>';
  try {
    const r = await fetch(`${API}/api/fs/ls`, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({path})});
    const d = await r.json();
    if (!d.ok) throw new Error(d.error||'Error');
    const items = d.items || d.entries || [];
    if (stat) stat.textContent = `${items.length} items  ·  ${path}`;
    if (!grid) return;
    grid.innerHTML = items.map(item => {
      const isDir = item.type==='dir'||item.is_dir||item.isDirectory;
      const ico = isDir ? '📁' : _fileIcon(item.name);
      return `<div onclick="${isDir?`filesNav('${path}/${item.name}')`:`filesOpen('${path}/${item.name}')`}"
        style="display:flex;flex-direction:column;align-items:center;gap:5px;padding:10px 6px;border-radius:8px;cursor:pointer;transition:background .15s;text-align:center"
        onmouseover="this.style.background='var(--bg-card)'" onmouseout="this.style.background=''"
        oncontextmenu="filesCtxMenu(event,'${path}/${item.name}',${isDir})">
        <span style="font-size:32px">${ico}</span>
        <span ondblclick="filesRename('${path}/${item.name}',this)" style="font-size:10px;color:var(--text);word-break:break-all;max-width:80px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${item.name}">${item.name}</span>
        ${item.size ? `<span style="font-size:9px;color:var(--text3)">${_fmtSize(item.size)}</span>` : ''}
      </div>`;
    }).join('') || '<div style="grid-column:1/-1;text-align:center;padding:30px;color:var(--text3)">Empty folder</div>';
  } catch(e) {
    if (grid) grid.innerHTML = `<div style="grid-column:1/-1;text-align:center;padding:30px;color:var(--text3)">Cannot access: ${e.message}</div>`;
    if (stat) stat.textContent = 'Error loading directory';
  }
}

async function filesRename(oldPath, labelEl) {
  const oldName = oldPath.split('/').pop();
  const newName = prompt('Rename to:', oldName);
  if (!newName || newName === oldName) return;
  const newPath = oldPath.replace(/[^/]+$/, newName);
  // Read old → write new → delete old
  try {
    const r = await fetch(`${API}/api/fs/read`, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({path:oldPath})});
    const d = await r.json();
    if (!d.ok) throw new Error(d.error);
    await fetch(`${API}/api/fs/write`, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({path:newPath, content:d.content||''})});
    await fetch(`${API}/api/fs/delete`, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({path:oldPath})});
    if (labelEl) labelEl.textContent = newName;
    filesNav(_filesPath);
  } catch(e) { notify("Rename failed", e.message, "error"); }
}

function filesBack()    { if (_filesHistPos>0)  filesNav(_filesHistory[--_filesHistPos]); }
function filesForward() { if (_filesHistPos<_filesHistory.length-1) filesNav(_filesHistory[++_filesHistPos]); }
function filesUpload()  { const i=document.createElement('input'); i.type='file'; i.multiple=true; i.onchange=e=>filesUploadFiles(e.target.files); i.click(); }

async function filesUploadFiles(files) {
  for (const f of files) {
    const text = await f.text();
    await fetch(`${API}/api/fs/write`, {method:'POST', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({path:`${_filesPath}/${f.name}`, content:text})});
  }
  filesNav(_filesPath);
}

function luovsNewFileWithContent(name, text) {
  if (!window.luovsFS) return;
  luovsFS.files[name] = text;
  luovsFS.save();
  luovsOpenFile(name);
}

async function filesOpen(path) {
  const ext = path.split('.').pop().toLowerCase();
  if (ext === 'pdf') {
    openApp("browser");
    setTimeout(() => {
      const bar = document.getElementById("browser-url");
      if (bar) { bar.value = `${API}/api/serve-file?path=${encodeURIComponent(path)}`; browserLoad(bar.value); }
    }, 400);
    return;
  }
  const r = await fetch(`${API}/api/fs/read`, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({path})});
  const d = await r.json();
  if (d.ok) {
    openApp('vscode');
    setTimeout(()=>{ if(window.luovsNewFileWithContent) luovsNewFileWithContent(path.split('/').pop(), d.content||d.text||''); }, 500);
  }
}

async function filesSearch() {
  const q = prompt('Search files:'); if (!q) return;
  const grid = document.getElementById('files-grid');
  const stat = document.getElementById('files-status');
  if (grid) grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:20px;color:var(--text3)">Searching...</div>';
  fetch(`${API}/api/fs/search`, {method:'POST', headers:{'Content-Type':'application/json'},
    body:JSON.stringify({path:_filesPath||'~', query:q})})
  .then(r=>r.json()).then(d => {
    if (!d.ok || !d.results) throw new Error(d.error||'No results');
    if (stat) stat.textContent = `${d.results.length} results for "${q}"`;
    if (!grid) return;
    grid.innerHTML = d.results.map(item =>
      `<div onclick="filesNav('${item.path.replace(/\/[^\/]+$/, '')}')"

let _termHistory = [], _termHistIdx = -1;

async function termRun(cmd) {
  const out = document.getElementById('term-output');
  if (!out) return;
  const prompt = document.getElementById('term-prompt-label')?.textContent || 'luoos $';
  out.innerHTML += `<span style="color:#3fb950">${prompt}</span> ${cmd}\n`;
  _termHistory.unshift(cmd); _termHistIdx = -1;
  if (!cmd.trim()) { out.scrollTop=out.scrollHeight; return; }

  // Built-in commands
  const lc = cmd.trim().toLowerCase();
  const cmds = {
    "3d-studio": ()=>"Opening 3D Studio..." + (setTimeout(()=>openApp("blender"),100)&&""),
    "worldmonitor": ()=>"Opening WorldMonitor..." + (setTimeout(()=>openApp("worldmonitor"),100)&&""),
    "apps": ()=>_AL_APPS.map(a=>a.icon+" "+a.name).join("  "),
    help: ()=>`Available commands:\n  help      — this list\n  clear     — clear terminal\n  ls [path] — list files\n  cat [f]   — read file\n  pwd       — current directory\n  echo [x]  — print text\n  luokai [q]— ask LUOKAI\n  date      — current date/time\n  whoami    — current user\n  uname     — system info`,
    clear: ()=>{ out.innerHTML=''; return ''; },
    date:  ()=>new Date().toString(),
    whoami:()=>window._luoUser||'luokai25',
    uname: ()=>`LuoOS v1.0 | ${navigator.platform} | ${navigator.userAgent.split(' ').pop()}`,
    pwd:   ()=>window._termCwd||'~',
  };

  const parts = cmd.trim().split(/\s+/);
  const base  = parts[0].toLowerCase();

  if (base === 'clear') { out.innerHTML=''; return; }
  if (base === 'echo')  { out.innerHTML += parts.slice(1).join(' ')+'\n'; out.scrollTop=out.scrollHeight; return; }

  if (base === 'luokai') {
    const q = parts.slice(1).join(' ');
    if (!q) { out.innerHTML += 'Usage: luokai <question>\n'; out.scrollTop=out.scrollHeight; return; }
    out.innerHTML += `<span style="color:#8b949e">LUOKAI thinking...\n</span>`;
    try {
      const r = await fetch(`${API}/api/chat`, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({message:q})});
      const d = await r.json();
      out.innerHTML = out.innerHTML.replace('<span style="color:#8b949e">LUOKAI thinking...\n</span>', '');
      out.innerHTML += `<span style="color:#79c0ff">${(d.response||'No response').replace(/</g,'&lt;')}\n</span>`;
    } catch { out.innerHTML += 'Error connecting to LUOKAI\n'; }
    out.scrollTop=out.scrollHeight; return;
  }

  if (cmds[base]) { const res = cmds[base](); if (res) out.innerHTML += res+'\n'; out.scrollTop=out.scrollHeight; return; }

  // Send to server
  try {
    const r = await fetch(`${API}/api/execute`, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({command:cmd, cwd:window._termCwd||'~'})});
    const d = await r.json();
    const result = d.output || d.stdout || d.result || d.error || '';
    if (result) {
      const clean = result
        .replace(/\x1b\[[0-9;]*m/g,'')   // strip ANSI colors
        .replace(/\x1b\[[0-9;]*[A-Za-z]/g,'') // strip other ANSI
        .replace(/</g,'&lt;').replace(/>/g,'&gt;');
      out.innerHTML += clean + '\n';
    }
    if (d.cwd) window._termCwd = d.cwd;
  } catch { out.innerHTML += `Command not found: ${base}\n`; }
  out.scrollTop = out.scrollHeight;
}

  else if (k === '%') calcPress('%');
  else if (k === 'Enter' || k === '=') calcPress('=');
  else if (k === 'Escape') calcPress('AC');

  }
});

function termKeydown(e) {
  const inp = e.target;
  if (e.key === 'Enter') { const v=inp.value; inp.value=''; termRun(v); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); if(_termHistIdx<_termHistory.length-1){_termHistIdx++;inp.value=_termHistory[_termHistIdx]||'';} }
  else if (e.key === 'ArrowDown') { e.preventDefault(); _termHistIdx=Math.max(-1,_termHistIdx-1); inp.value=_termHistIdx>=0?_termHistory[_termHistIdx]:''; }
  else if (e.key==='Tab') {
    e.preventDefault();
    const v = inp.value; const parts = v.split(' '); const last = parts[parts.length-1];
    if (!last) return;
    fetch(`${API}/api/fs/ls`, {method:'POST', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({path: last.includes('/') ? last.replace(/\/[^\/]*$/, '') : window._termCwd||'~'})
    }).then(r=>r.json()).then(d=>{
      const prefix = last.replace(/^.*\//, '');
      const matches = (d.items||[]).filter(i => i.name.toLowerCase().startsWith(prefix.toLowerCase()));
      if (matches.length === 1) {
        parts[parts.length-1] = (last.replace(/[^\/]*$/, '') + matches[0].name + (matches[0].is_dir?'/':''));
        inp.value = parts.join(' ');
      } else if (matches.length > 1) {
        const out = document.getElementById('term-output');
        if (out) out.innerHTML += matches.map(m=>m.name).join('  ') + '\n';
      }
    }).catch(()=>{});
  }
  else if (e.ctrlKey && e.key==='c') { termRun(''); inp.value=''; }
}

// ═══ SCREENSAVER (5 min idle) ════════════════════════════════
let _ssTimer = null, _ssActive = false;
const _SS_DELAY = 5 * 60 * 1000; // 5 minutes

function _ssReset() {
  clearTimeout(_ssTimer);
  if (_ssActive) _ssDismiss();
  _ssTimer = setTimeout(_ssShow, _SS_DELAY);
}

function _ssShow() {
  if (_ssActive) return;
  _ssActive = true;
  const ss = document.createElement("div");
  ss.id = "screensaver";
  ss.style.cssText = "position:fixed;inset:0;z-index:99999;background:#000;display:flex;align-items:center;justify-content:center;cursor:pointer";
  ss.onclick = _ssDismiss;
  ss.innerHTML = `
    <div style="text-align:center">
      <div style="font-size:min(20vw,200px);font-weight:900;color:transparent;
                  background:linear-gradient(135deg,#4fc3f7,#7c3aed,#10b981);
                  -webkit-background-clip:text;background-clip:text;
                  animation:ss-pulse 3s ease-in-out infinite">LUO</div>
      <div id="ss-time" style="font-size:14px;color:#444;margin-top:20px;font-family:monospace"></div>
    </div>`;
  document.body.appendChild(ss);
  const tick = () => {
    const el = document.getElementById("ss-time");
    if (el) el.textContent = new Date().toLocaleTimeString();
    if (_ssActive) requestAnimationFrame(tick);
  };
  tick();
  const style = document.createElement("style");
  style.textContent = "@keyframes ss-pulse{0%,100%{opacity:.3}50%{opacity:1}}";
  document.head.appendChild(style);
}

function _ssDismiss() {
  _ssActive = false;
  document.getElementById("screensaver")?.remove();
  _ssReset();
}

["mousemove","keydown","mousedown","touchstart"].forEach(ev =>
  document.addEventListener(ev, _ssReset, {passive:true}));
_ssReset();

async function sendChatStream(msg) {
  const msgs = document.getElementById("chat-messages") || document.getElementById("luokai-messages");
  if (!msgs) return sendChat(); // fallback
  // User message
  const uDiv = document.createElement("div");
  uDiv.className = "chat-msg user"; uDiv.textContent = msg;
  msgs.appendChild(uDiv);
  // AI message container
  const aDiv = document.createElement("div");
  aDiv.className = "chat-msg ai";
  aDiv.innerHTML = '<span style="color:var(--text3)">●●●</span>';
  msgs.appendChild(aDiv);
  msgs.scrollTop = msgs.scrollHeight;
  try {
    const r = await fetch(`${API}/api/chat/stream`, {
      method:"POST", headers:{"Content-Type":"application/json"},
      body:JSON.stringify({message:msg})
    });
    if (!r.ok || !r.body) throw new Error("stream failed");
    const reader = r.body.getReader();
    const decoder = new TextDecoder();
    let full = "";
    aDiv.innerHTML = "";
    while (true) {
      const {done, value} = await reader.read();
      if (done) break;
      const chunk = decoder.decode(value);
      const lines = chunk.split("\n");
      for (const line of lines) {
        if (line.startsWith("data: ")) {
          const token = line.slice(6);
          if (token === "[DONE]") break;
          full += token;
          aDiv.innerHTML = _renderChatMsg ? _renderChatMsg(full) : full.replace(/</g,"&lt;").replace(/\n/g,"<br>");
          msgs.scrollTop = msgs.scrollHeight;
        }
      }
    }
    // Save to memory
    _chatHistoryLocal = _chatHistoryLocal || [];
    _chatHistoryLocal.push({role:"user",content:msg},{role:"assistant",content:full});
  } catch(e) {
    aDiv.innerHTML = "Error: " + e.message;
  }
}

async function fetchWeather() {

        badge.title = `${d.name}: ${d.weather[0].description}`;

let _pomodoroTimer = null, _pomodoroLeft = 25*60, _pomodoroRunning = false;
const _POMO_MODES = {work:25*60, short:5*60, long:15*60};

function pomodoroToggle() {
  const btn = document.getElementById("pomo-btn");
  if (_pomodoroRunning) {
    clearInterval(_pomodoroTimer); _pomodoroRunning = false;
    if (btn) btn.style.color = "var(--text2)";
  } else {
    _pomodoroRunning = true;
    if (btn) btn.style.color = "var(--accent)";
    _pomodoroTimer = setInterval(() => {
      _pomodoroLeft--;
      const m = Math.floor(_pomodoroLeft/60), s = _pomodoroLeft%60;
      const el = document.getElementById("pomo-time");
      if (el) el.textContent = `${m}:${String(s).padStart(2,"0")}`;
      if (_pomodoroLeft <= 0) {
        clearInterval(_pomodoroTimer); _pomodoroRunning = false;
        notify("🍅 Pomodoro done!", "Time for a break", "info");
        _pomodoroLeft = _POMO_MODES.short;
        if (btn) btn.style.color = "var(--accent3)";
      }
    }, 1000);
  }
}
function pomodoroReset() {
  clearInterval(_pomodoroTimer); _pomodoroRunning = false;
  _pomodoroLeft = _POMO_MODES.work;
  const el = document.getElementById("pomo-time");
  if (el) el.textContent = "25:00";

function showDiff(textA, textB, titleA, titleB) {
  const linesA = (textA||"").split("\n");
  const linesB = (textB||"").split("\n");
  const maxLen = Math.max(linesA.length, linesB.length);
  let html = `<div style="display:grid;grid-template-columns:1fr 1fr;height:100%;gap:1px;background:var(--border)">
    <div style="background:var(--bg-panel);overflow:auto;padding:8px;font-family:monospace;font-size:11px">
      <div style="font-weight:700;color:var(--text2);margin-bottom:8px">${titleA||"File A"}</div>`;
  for (let i=0; i<maxLen; i++) {
    const a=linesA[i]??"", b=linesB[i]??"";

    html += `<div style="padding:1px 4px;${diff?"background:rgba(255,80,80,.15);color:#ff8080":""}">${a.replace(/</g,"&lt;")}</div>`;
  }
  html += `</div><div style="background:var(--bg-panel);overflow:auto;padding:8px;font-family:monospace;font-size:11px">
    <div style="font-weight:700;color:var(--text2);margin-bottom:8px">${titleB||"File B"}</div>`;
  for (let i=0; i<maxLen; i++) {
    const a=linesA[i]??"", b=linesB[i]??"";
    const diff = a!==b;
    html += `<div style="padding:1px 4px;${diff?"background:rgba(80,255,80,.1);color:#80ff80":""}">${b.replace(/</g,"&lt;")}</div>`;
  }
  html += "</div></div>";
  // Open in VS Code or popup
  const w = window.open("","_blank","width=900,height=600");
  w.document.write(`<html><head><title>Diff</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#0d1117;color:#c9d1d9}</style></head><body>${html}</body></html>`);
}

// ═══════════════════════════════════════════════════════════════════
// GESTURE RECEIVER — receives postMessage from /hand-tracker iframe
// ═══════════════════════════════════════════════════════════════════
let _htDragEl = null, _htDragOffX = 0, _htDragOffY = 0, _htLastMove = 0;

window.addEventListener("message", e => {
  const msg = e.data;
  if (!msg || !msg._luoHandEvent) return;
  const statusEl = document.getElementById("ht-status");
  const gestEl   = document.getElementById("ht-gesture");

  // Ensure virtual cursor exists
  let vcur = document.getElementById("ht-virtual-cursor");
  if (!vcur && ["CURSOR_MOVE","CLICK","MOUSE_DOWN"].includes(msg.type)) {
    vcur = document.createElement("div");
    vcur.id = "ht-virtual-cursor";
    vcur.style.cssText = "position:fixed;z-index:99997;width:18px;height:18px;border-radius:50%;background:rgba(0,212,255,.7);border:2px solid #00d4ff;transform:translate(-50%,-50%);pointer-events:none;transition:left .04s,top .04s;box-shadow:0 0 18px rgba(0,212,255,.7)";
    document.body.appendChild(vcur);
  }

  switch(msg.type) {
    case "CURSOR_MOVE":
      if (vcur) { vcur.style.left=msg.x+"px"; vcur.style.top=msg.y+"px"; }
      if (_htDragEl) {
        _htDragEl.style.left = Math.max(0, msg.x-_htDragOffX)+"px";
        _htDragEl.style.top  = Math.max(0, msg.y-_htDragOffY)+"px";
      }
      break;

    case "CLICK":
      (function(){
        const el = document.elementFromPoint(msg.x, msg.y);
        if (!el) return;
        ["mousedown","mouseup","click"].forEach(t =>
          el.dispatchEvent(new MouseEvent(t, {bubbles:true,clientX:msg.x,clientY:msg.y})));
        if (el.tagName==="INPUT"||el.tagName==="TEXTAREA"||el.tagName==="BUTTON") el.focus();
        // Visual flash
        const os = el.style.boxShadow;
        el.style.boxShadow = "0 0 0 3px rgba(0,212,255,.6)";
        setTimeout(()=>el.style.boxShadow=os, 280);
        if (statusEl) statusEl.textContent = "Clicked " + (el.id||el.className||el.tagName).slice(0,30);
      })(); break;

    case "MOUSE_DOWN":
      (function(){
        const el = document.elementFromPoint(msg.x, msg.y);
        if (!el) return;
        el.dispatchEvent(new MouseEvent("mousedown", {bubbles:true,clientX:msg.x,clientY:msg.y}));
        const tb = el.closest(".window-titlebar,.titlebar,.dbar,[id*=titlebar]");
        if (tb) {
          const win = tb.closest(".window") || tb.parentElement?.parentElement;
          if (win) { _htDragEl=win; _htDragOffX=msg.x-win.offsetLeft; _htDragOffY=msg.y-win.offsetTop; }
        }
      })(); break;

    case "MOUSE_UP":
      (function(){
        const el = document.elementFromPoint(msg.x, msg.y);
        if (el) el.dispatchEvent(new MouseEvent("mouseup", {bubbles:true,clientX:msg.x,clientY:msg.y}));
        _htDragEl = null;
      })(); break;

    case "RIGHT_CLICK":
      (function(){
        const el = document.elementFromPoint(msg.x, msg.y);
        if (el) el.dispatchEvent(new MouseEvent("contextmenu", {bubbles:true,clientX:msg.x,clientY:msg.y}));
      })(); break;

    case "SCROLL":
      (function(){
        const el = document.elementFromPoint(msg.x, msg.y);
        if (el) el.dispatchEvent(new WheelEvent("wheel", {bubbles:true,deltaY:msg.deltaY,clientX:msg.x,clientY:msg.y}));
      })(); break;

    case "WAVE":
      if (typeof windows !== "undefined") Object.keys(windows).forEach(id=>minimizeApp(id));
      notify("👋 Wave", "Show desktop", "info"); break;

    case "CONFIRM":
      (function(){
        const focused = document.activeElement;
        if (focused&&focused!==document.body) focused.click();
        notify("👍 Confirm", "", "info");
      })(); break;

    case "CANCEL":
      (function(){
        const wins = document.querySelectorAll(".window:not(.minimized)");
        if (wins.length) { const w=wins[wins.length-1]; minimizeApp(w.id); }
        notify("👎 Cancel", "Window minimized", "info");
      })(); break;

    case "PINCH_ZOOM":
      (function(){
        const focused = document.querySelector(".window:not(.minimized):last-child");
        if (focused&&msg.delta) {
          focused.style.width  = Math.max(320,(parseInt(focused.style.width)||focused.offsetWidth)  + msg.delta*2)+"px";
          focused.style.height = Math.max(240,(parseInt(focused.style.height)||focused.offsetHeight) + msg.delta*1.5)+"px";
        }
      })(); break;
  }

  // Update gesture emoji in status bar
  if (gestEl && msg.gesture) {
    const emap = {POINT:"☝️",PINCH:"🤏",FIST:"✊",PEACE:"✌️",OPEN_HAND:"🖐️",WAVE:"👋",THUMBS_UP:"👍",THUMBS_DOWN:"👎"};
    gestEl.textContent = emap[msg.gesture]||"🖐️";
  }
});

// ═══════════════════════════════════════════════════════════════
// PILLAR 1 — PERCEPTION (face mesh + gaze)
// ═══════════════════════════════════════════════════════════════
window.addEventListener("message", e => {
  const m = e.data;
  if (!m || !m._luoFaceEvent) return;

  // Eye gaze cursor (fallback when no hand visible)
  if (m.type === "GAZE_UPDATE") {
    let g = document.getElementById("gaze-cursor");
    if (!g) {
      g = document.createElement("div");
      g.id = "gaze-cursor";
      g.style.cssText = "position:fixed;width:30px;height:30px;border-radius:50%;border:2px dashed rgba(255,107,107,.5);transform:translate(-50%,-50%);pointer-events:none;z-index:99996;transition:left .12s,top .12s;display:none";
      document.body.appendChild(g);
    }
    // Show gaze cursor only if no hand cursor
    const handCur = document.getElementById("ht-virtual-cursor");
    g.style.display = (handCur && handCur.style.left) ? "none" : "block";
    g.style.left = m.x + "px"; g.style.top = m.y + "px";

    // Mood-aware UI
    if (m.mood && m.mood !== window._luoMood) {
      window._luoMood = m.mood;
      if (m.mood.includes("happy")) {
        // Subtle particle burst
        for (let i=0; i<8; i++) {
          const p = document.createElement("div");
          p.style.cssText = `position:fixed;left:${m.x}px;top:${m.y}px;width:6px;height:6px;border-radius:50%;background:#ff6b6b;pointer-events:none;z-index:99995;animation:partFly .6s ease-out forwards`;
          p.style.setProperty("--dx", (Math.random()*100-50)+"px");
          p.style.setProperty("--dy", (Math.random()*100-50)+"px");
          document.body.appendChild(p);
          setTimeout(()=>p.remove(), 600);
        }
      }
    }

    // Stress-aware (low attention = simpler UI)
    if (m.attention !== undefined) {
      window._luoAttention = m.attention;
      // Could dim distractions when focused
    }

    // Tired detection (high blink rate or eyes closed long)
    const eyesClosed = (m.blendshapes?.eyeBlinkLeft||0) + (m.blendshapes?.eyeBlinkRight||0);
    if (eyesClosed > 1.5 && !window._luoTiredAlerted) {
      window._luoTiredAlerted = true;
      notify("😴 Take a break", "You seem tired. Want to start a Pomodoro?", "info");
      setTimeout(()=>{ window._luoTiredAlerted = false; }, 600000); // remind every 10 min max
    }
  }
});

// PILLAR 3 — LUOKAI AGENT (tool-calling)
// ═══════════════════════════════════════════════════════════════
async function agentSend() {
  const inp = document.getElementById("agent-input");
  const log = document.getElementById("agent-log");
  if (!inp || !log) return;
  const msg = inp.value.trim();
  if (!msg) return;
  inp.value = "";

  // User message
  log.innerHTML += `<div style="margin-bottom:14px"><span style="color:#10b981">▶ You:</span> <span style="color:var(--text)">${msg}</span></div>`;
  log.innerHTML += `<div id="agent-thinking" style="color:#7c3aed;margin-bottom:14px"><span class="agent-loader">⚡ LUOKAI thinking...</span></div>`;
  log.scrollTop = log.scrollHeight;

  try {
    const r = await fetch(`${API}/api/agent/chat`, {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({message: msg})
    });
    const d = await r.json();
    document.getElementById("agent-thinking")?.remove();

    if (d.actions?.length) {
      log.innerHTML += `<div style="background:rgba(124,58,237,.08);border-left:3px solid #7c3aed;padding:8px 14px;margin-bottom:8px;border-radius:6px"><div style="font-size:10px;color:#a78bfa;margin-bottom:6px">⚡ Plan executed (${d.steps} steps)</div>`;
      for (const a of d.actions) {
        log.innerHTML += `<div style="font-size:11px;color:var(--text2);margin:3px 0">→ <code style="background:rgba(0,212,255,.1);padding:1px 6px;border-radius:3px;color:#4fc3f7">${a.tool}</code> <span style="color:var(--text3)">${JSON.stringify(a.args).slice(0,120)}</span></div>`;
      }
      log.innerHTML += `</div>`;
    }
    if (d.answer) {
      log.innerHTML += `<div style="margin-bottom:18px"><span style="color:#c586c0">✦ LUOKAI:</span> <span style="color:var(--text)">${(d.answer||"").replace(/</g,"&lt;").replace(/\n/g,"<br>")}</span></div>`;
    }
    log.scrollTop = log.scrollHeight;

    // Poll for UI actions
    pollAgentActions();
  } catch(e) {
    document.getElementById("agent-thinking")?.remove();
    log.innerHTML += `<div style="color:#f44">Error: ${e.message}</div>`;
  }
}

async function pollAgentActions() {
  try {
    const r = await fetch(`${API}/api/agent/pending`);
    const d = await r.json();
    for (const action of (d.actions||[])) {
      executeAgentAction(action);
    }
  } catch(e) {}
}

function executeAgentAction(a) {
  switch(a.tool) {
    case "open_app":     openApp(a.args.app); break;
    case "close_app":    if (windows[a.args.app]) minimizeApp(a.args.app); break;
    case "open_url":     openApp("browser"); setTimeout(()=>browserLoad(a.args.url),400); break;
    case "search_web":   openApp("browser"); setTimeout(()=>browserSearch?.(a.args.query),400); break;
    case "notify":       notify(a.args.title, a.args.body, a.args.type||"info"); break;
    case "read_news":    openApp("worldmonitor"); setTimeout(()=>wmLoad(a.args.category||"top"),400); break;
    case "create_note":  openApp("notes"); setTimeout(()=>{
      _notes[a.args.title] = {body:a.args.content||"", ts:new Date().toISOString()};
      _currentNote = a.args.title;
      localStorage.setItem("luo-notes", JSON.stringify(_notes));
      noteInit();
    },400); break;
    case "schedule_event":
      if (!_calEvents[a.args.date]) _calEvents[a.args.date]=[];
      _calEvents[a.args.date].push(a.args.event);
      localStorage.setItem("luo-cal-events", JSON.stringify(_calEvents));
      notify("📅 Event added", `${a.args.event} on ${a.args.date}`, "info");
      break;
  }
  // Report back
  fetch(`${API}/api/agent/report`, {
    method:"POST", headers:{"Content-Type":"application/json"},
    body:JSON.stringify({id:a.id, result:{ok:true}})
  }).catch(()=>{});
}

async function agentShowTools() {
  const r = await fetch(`${API}/api/agent/tools`);
  const d = await r.json();
  const log = document.getElementById("agent-log");
  if (!log) return;
  log.innerHTML += `<div style="background:rgba(0,212,255,.05);border-left:3px solid #4fc3f7;padding:10px 14px;margin-bottom:14px;border-radius:6px;font-size:11px">

    ${Object.entries(d.tools||{}).map(([n,t])=>`<div style="margin:3px 0;color:var(--text2)"><code style="color:#4fc3f7">${n}</code> — <span style="color:var(--text3)">${t.description}</span></div>`).join("")}

// ═══════════════════════════════════════════════════════════════
// PILLAR 4 — MIND CANVAS (infinite spatial canvas)
// ═══════════════════════════════════════════════════════════════
let _canvasNodes = [], _canvasEdges = [];
let _canvasZoom = 1, _canvasOffsetX = 0, _canvasOffsetY = 0;
let _canvasDragNode = null, _canvasPanning = false;

function canvasInit() {
  // Load saved state
  fetch(`${API}/api/canvas/load`).then(r=>r.json()).then(d => {
    if (d.ok && d.data) {
      _canvasNodes = d.data.nodes || [];
      _canvasEdges = d.data.edges || [];
      canvasRender();
    }
  }).catch(()=>{});
}

function canvasRender() {
  const stage = document.getElementById("canvas-stage");
  const svg   = document.getElementById("canvas-svg");
  if (!stage || !svg) return;
  // Clear and rebuild nodes
  stage.querySelectorAll(".cn").forEach(e=>e.remove());
  for (const n of _canvasNodes) {
    const el = document.createElement("div");
    el.className = "cn";
    el.dataset.id = n.id;
    const colors = {note:"#fbbf24",image:"#06b6d4",link:"#10b981",text:"#4fc3f7"};
    el.style.cssText = `position:absolute;left:${n.x}px;top:${n.y}px;min-width:${n.w||180}px;min-height:${n.h||100}px;background:rgba(255,255,255,.06);border:2px solid ${colors[n.type]||"#4fc3f7"};border-radius:10px;padding:12px;cursor:move;color:var(--text);font-size:12px;backdrop-filter:blur(10px);transition:transform .15s;box-shadow:0 4px 20px rgba(0,0,0,.3)`;
    el.onmousedown = e => { _canvasDragNode = n; canvasNodeDragStart(e); };
    if (n.type === "note") el.innerHTML = `<div style="font-weight:700;color:${colors.note};margin-bottom:6px">📝 ${n.title||"Note"}</div><div style="font-size:11px;line-height:1.6">${(n.content||"").slice(0,300)}</div>`;
    else if (n.type === "image") el.innerHTML = `<img src="${n.src||""}" style="width:100%;border-radius:6px">`;
    else if (n.type === "link") el.innerHTML = `<div style="font-weight:700;color:${colors.link};margin-bottom:4px">🔗 Link</div><a href="${n.url}" target="_blank" style="color:${colors.link};text-decoration:none;font-size:11px;word-break:break-all">${n.url}</a>`;
    else el.textContent = n.content || "Empty";
    stage.appendChild(el);
  }
  // Render edges
  svg.innerHTML = _canvasEdges.map(e => {
    const a = _canvasNodes.find(n=>n.id===e.from);
    const b = _canvasNodes.find(n=>n.id===e.to);
    if (!a || !b) return "";
    return `<line x1="${a.x+90}" y1="${a.y+50}" x2="${b.x+90}" y2="${b.y+50}" stroke="rgba(124,58,237,.6)" stroke-width="2" marker-end="url(#arrow)"/>`;
  }).join("") + `<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="rgba(124,58,237,.8)"/></marker></defs>`;

  document.getElementById("canvas-stats").textContent = `${_canvasNodes.length} nodes · ${_canvasEdges.length} connections`;
  document.getElementById("canvas-zoom").textContent = Math.round(_canvasZoom*100) + "%";
  canvasSave();
}

function canvasAddNote() {
  const text = prompt("Note content:");
  if (!text) return;
  const stage = document.getElementById("canvas-stage");
  const rect = stage.getBoundingClientRect();
  _canvasNodes.push({
    id: "n"+Date.now(), type:"note",
    x: -rect.left + window.innerWidth/2 + Math.random()*200-100,
    y: -rect.top + window.innerHeight/2 + Math.random()*200-100,
    title: "Note", content: text
  });
  canvasRender();
}

function canvasAddImage() {
  const inp = document.createElement("input"); inp.type="file"; inp.accept="image/*";
  inp.onchange = e => {
    const file = e.target.files[0]; if(!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      _canvasNodes.push({
        id:"n"+Date.now(), type:"image", src:ev.target.result,
        x: 200 + Math.random()*400, y: 200 + Math.random()*200,
        w: 220, h: 200
      });
      canvasRender();
    };
    reader.readAsDataURL(file);
  };
  inp.click();
}

function canvasAddLink() {
  const url = prompt("URL:");
  if (!url) return;
  _canvasNodes.push({
    id:"n"+Date.now(), type:"link", url,
    x: 300+Math.random()*300, y: 300+Math.random()*200, w: 200
  });
  canvasRender();
}

async function canvasOrganize() {
  if (_canvasNodes.length < 2) { notify("Need more nodes", "Add at least 2 nodes first", "info"); return; }
  notify("🤖 LUOKAI organising", "Clustering related nodes...", "info");
  try {
    const summaries = _canvasNodes.map(n => `[${n.id}] ${n.type}: ${(n.content||n.url||n.title||"").slice(0,80)}`).join("\n");
    const r = await fetch(`${API}/api/chat`, {method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({message:"Group these canvas nodes into 3 clusters by topic. Reply with: cluster1: [id1,id2], cluster2: [id3], etc.\n\n"+summaries})});
    const d = await r.json();
    notify("LUOKAI suggests:", d.response?.slice(0,200) || "no response", "info");
    // Simple grid layout based on clusters
    let row = 0, col = 0;
    for (let i=0; i<_canvasNodes.length; i++) {
      _canvasNodes[i].x = 100 + col * 250;
      _canvasNodes[i].y = 100 + row * 200;
      col++; if (col >= 3) { col = 0; row++; }
    }
    canvasRender();
  } catch(e) { notify("Error", e.message, "error"); }
}

function canvasReset() {
  if (!confirm("Clear canvas? This cannot be undone.")) return;
  _canvasNodes = []; _canvasEdges = [];
  canvasRender();
}

function canvasSave() {
  fetch(`${API}/api/canvas/save`, {method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({nodes:_canvasNodes, edges:_canvasEdges})}).catch(()=>{});
}

function canvasNodeDragStart(e) {
  e.stopPropagation();
  const startX = e.clientX, startY = e.clientY;
  const startNX = _canvasDragNode.x, startNY = _canvasDragNode.y;
  document.onmousemove = mv => {
    _canvasDragNode.x = startNX + (mv.clientX - startX) / _canvasZoom;
    _canvasDragNode.y = startNY + (mv.clientY - startY) / _canvasZoom;
    canvasRender();
  };
  document.onmouseup = () => { document.onmousemove = null; document.onmouseup = null; _canvasDragNode = null; };
}

function canvasStartPan(e) {
  if (e.target.closest(".cn")) return;
  _canvasPanning = true;
  const sx = e.clientX, sy = e.clientY;
  const sox = _canvasOffsetX, soy = _canvasOffsetY;
  document.onmousemove = mv => {
    _canvasOffsetX = sox + mv.clientX - sx;
    _canvasOffsetY = soy + mv.clientY - sy;
    const stage = document.getElementById("canvas-stage");
    if (stage) stage.style.transform = `translate(${_canvasOffsetX}px,${_canvasOffsetY}px) scale(${_canvasZoom})`;
  };
  document.onmouseup = () => { document.onmousemove=null; document.onmouseup=null; _canvasPanning=false; };
}

function canvasZoom(e) {
  e.preventDefault();
  _canvasZoom = Math.max(0.3, Math.min(2.5, _canvasZoom + (e.deltaY < 0 ? 0.1 : -0.1)));
  const stage = document.getElementById("canvas-stage");
  if (stage) stage.style.transform = `translate(${_canvasOffsetX}px,${_canvasOffsetY}px) scale(${_canvasZoom})`;
  document.getElementById("canvas-zoom").textContent = Math.round(_canvasZoom*100) + "%";
}

// ═══════════════════════════════════════════════════════════════
// PILLAR 2 — SPATIAL COMPUTING
// Windows live in 3D space, tilt with head pose, push/pull with gestures
// ═══════════════════════════════════════════════════════════════
let _spatialEnabled = false;
let _winDepth = {}; // window id → z depth (0..1, 0=close, 1=far)

function spatialToggle() {
  _spatialEnabled = !_spatialEnabled;
  const root = document.body;
  if (_spatialEnabled) {
    root.style.perspective = "1500px";
    root.style.perspectiveOrigin = "50% 40%";
    Object.values(windows||{}).forEach(w => {
      w.style.transformStyle = "preserve-3d";
      w.style.transition = "transform .25s ease-out, filter .25s";
      _winDepth[w.id] = 0.5;
      _spatialApplyDepth(w);
    });
    notify("🌌 Spatial Mode ON", "Windows now exist in 3D space", "info");
  } else {
    Object.values(windows||{}).forEach(w => {
      w.style.transform = w.style.transform.replace(/translateZ\([^)]+\)|rotateY\([^)]+\)|rotateX\([^)]+\)|scale\([^)]+\)/g, "");
      w.style.filter = "";
    });
    root.style.perspective = "";
    notify("Spatial Mode OFF", "Windows back to 2D", "info");
  }
}

function _spatialApplyDepth(win) {
  if (!_spatialEnabled) return;
  const d = _winDepth[win.id] ?? 0.5;
  const z = -d * 400;            // farther = more negative Z
  const blur = d * 3;            // distant windows blur slightly
  const opacity = 1 - d * 0.4;   // distant windows fade
  const scale = 1 - d * 0.15;
  // Apply head pose tilt if perception is on
  const yaw   = (window._luoHeadYaw || 0) * 0.3;
  const pitch = (window._luoHeadPitch|| 0) * 0.3;
  win.style.transform = `translateZ(${z}px) rotateY(${yaw}deg) rotateX(${-pitch}deg) scale(${scale})`;
  win.style.filter = `blur(${blur}px) brightness(${opacity})`;
  win.style.zIndex = Math.round(1000 - d * 500);
}

// Bring window forward when clicked (pop to front)
const _origFocusWindow = typeof focusWindow === "function" ? focusWindow : null;
window.focusWindow = function(id) {
  if (_origFocusWindow) _origFocusWindow(id);
  if (_spatialEnabled) {
    Object.keys(_winDepth).forEach(k => { _winDepth[k] = Math.min(1, (_winDepth[k]||0.5) + 0.1); });
    _winDepth[id] = 0;
    Object.values(windows||{}).forEach(w => _spatialApplyDepth(w));
  }
};

// Listen to head pose from perception
window.addEventListener("message", e => {
  if (!e.data || !e.data._luoFaceEvent) return;
  if (e.data.yaw !== undefined)   window._luoHeadYaw = e.data.yaw;
  if (e.data.pitch !== undefined) window._luoHeadPitch = e.data.pitch;
  if (_spatialEnabled) {
    Object.values(windows||{}).forEach(w => _spatialApplyDepth(w));
  }
});

// Pinch zoom adjusts depth of focused window
const _origPinchHandler = window._origPinchHandler;
window.addEventListener("message", e => {
  if (!e.data || !e.data._luoHandEvent) return;
  if (e.data.type === "PINCH_ZOOM" && _spatialEnabled) {
    const focused = document.querySelector(".window:not(.minimized):last-child");
    if (focused) {
      _winDepth[focused.id] = Math.max(0, Math.min(1, (_winDepth[focused.id]||0.5) - e.data.delta * 0.001));
      _spatialApplyDepth(focused);
    }
  }
});

// ═══════════════════════════════════════════════════════════════
// PILLAR 7 — BIOFEEDBACK
// Heart rate from face skin colour (rPPG/photoplethysmography)
// Stress detection → calmer UI · Eye strain → warmer screen tint
// ═══════════════════════════════════════════════════════════════
const _bioState = {
  hrSignal: [],         // green channel samples
  hrTimestamps: [],
  bpm: null,
  stressLevel: 0,       // 0-1
  eyeStrainTime: 0,     // seconds of close-screen
  lastPostureCheck: Date.now(),
  postureWarnings: 0,
};

// Receive rPPG samples from perception module (added below in perception integration)
window.addEventListener("message", e => {
  if (!e.data || !e.data._luoFaceEvent) return;

  // rPPG: track green channel pulse
  if (e.data.type === "GAZE_UPDATE" && e.data.greenChannel !== undefined) {
    const now = performance.now();
    _bioState.hrSignal.push(e.data.greenChannel);
    _bioState.hrTimestamps.push(now);
    // Keep last 300 samples (~10 sec at 30fps)
    if (_bioState.hrSignal.length > 300) {
      _bioState.hrSignal.shift();
      _bioState.hrTimestamps.shift();
    }
    if (_bioState.hrSignal.length >= 150 && _bioState.hrSignal.length % 30 === 0) {
      bioComputeHR();
    }
  }

  // Mood-based stress level
  if (e.data.mood) {
    if (e.data.mood.includes("happy"))    _bioState.stressLevel = Math.max(0, _bioState.stressLevel - 0.05);
    if (e.data.mood.includes("frowning")) _bioState.stressLevel = Math.min(1, _bioState.stressLevel + 0.03);
  }

  // Attention-based focus mode
  if (e.data.attention !== undefined && e.data.attention > 0.85 && !window._luoDND) {
    window._luoDND = true;
    notify("🎯 Focus mode", "Notifications muted while you concentrate", "info");
    setTimeout(()=> { window._luoDND = false; }, 600000); // auto-off after 10 min
  }
});

function bioComputeHR() {
  // FFT-free peak detection on the band-pass filtered signal
  const signal = _bioState.hrSignal.slice();
  const ts     = _bioState.hrTimestamps.slice();

  // Normalize
  const mean = signal.reduce((a,b)=>a+b,0) / signal.length;
  const norm = signal.map(v => v - mean);

  // Simple peak detection
  const peaks = [];
  for (let i = 2; i < norm.length - 2; i++) {
    if (norm[i] > norm[i-1] && norm[i] > norm[i+1] &&
        norm[i] > norm[i-2] && norm[i] > norm[i+2] &&
        norm[i] > 0.5) {
      peaks.push(ts[i]);
    }
  }
  if (peaks.length < 4) return;

  // Average inter-peak interval → bpm
  const intervals = [];
  for (let i = 1; i < peaks.length; i++) intervals.push(peaks[i] - peaks[i-1]);
  const avgMs = intervals.reduce((a,b)=>a+b,0) / intervals.length;
  const bpm   = Math.round(60000 / avgMs);
  if (bpm > 40 && bpm < 180) {
    _bioState.bpm = bpm;
    bioApplyAdaptation();
  }
}

function bioApplyAdaptation() {
  const bpm = _bioState.bpm;
  if (!bpm) return;
  // High BPM (>90) suggests stress → calmer animation speed
  if (bpm > 95) {
    document.documentElement.style.setProperty("--anim-speed", "1.4");
    _bioState.stressLevel = Math.min(1, _bioState.stressLevel + 0.02);
  } else if (bpm < 70) {
    document.documentElement.style.setProperty("--anim-speed", "0.85");
    _bioState.stressLevel = Math.max(0, _bioState.stressLevel - 0.01);
  }

  // Update bio HUD
  const hud = document.getElementById("bio-hud");
  if (hud) hud.innerHTML = `<span style="color:#ff6b6b">♥ ${bpm} bpm</span> · <span style="color:#fbbf24">stress ${Math.round(_bioState.stressLevel*100)}%</span>`;

  // Stress warning
  if (_bioState.stressLevel > 0.8 && !window._stressWarned) {
    window._stressWarned = true;
    notify("💚 Stress detected", "Take a deep breath. Want a 5-min Pomodoro?", "info");
    setTimeout(()=> { window._stressWarned = false; }, 900000); // 15 min between warnings
  }
}

// ── EYE STRAIN: shift screen tint warmer over time ────────────────
setInterval(() => {
  _bioState.eyeStrainTime += 60;  // +1 min
  // After 30 min, gradually shift to warm tint (f.lux-style)
  if (_bioState.eyeStrainTime > 1800) {
    const warmth = Math.min(0.3, (_bioState.eyeStrainTime - 1800) / 7200);
    document.body.style.filter = `sepia(${warmth}) brightness(${1 - warmth*0.1})`;
  }
}, 60000);

// Reset eye strain on activity
document.addEventListener("mousemove", () => {
  if (_bioState.eyeStrainTime > 0) _bioState.eyeStrainTime = Math.max(0, _bioState.eyeStrainTime - 1);
});

// ── POSTURE: warn every 25 min ────────────────────────────────────
setInterval(() => {
  const now = Date.now();
  if (now - _bioState.lastPostureCheck > 1500000) {  // 25 min
    _bioState.lastPostureCheck = now;
    _bioState.postureWarnings++;
    notify("🧍 Posture check", "Sit up straight. Stretch your shoulders. " + _bioState.postureWarnings + " checks today.", "info");
  }
}, 60000);

// ═══════════════════════════════════════════════════════════════
// PILLAR 5 — MULTIPLAYER COLLABORATION (WebRTC P2P)
// Connect two LuoOS instances, share cursors, chat, whiteboard
// ═══════════════════════════════════════════════════════════════
const _luoMP = {
  pc:        null,
  dc:        null,
  isHost:    false,
  peerName:  null,
  myName:    null,
  cursors:   {},   // peer name → {x, y, el}
  connected: false,
};

async function mpInit() {
  if (_luoMP.pc) return;
  _luoMP.pc = new RTCPeerConnection({
    iceServers: [{urls: "stun:stun.l.google.com:19302"}]
  });
  _luoMP.pc.onconnectionstatechange = () => {
    const s = _luoMP.pc.connectionState;
    document.getElementById("mp-status") && (document.getElementById("mp-status").textContent = s);
    if (s === "connected") {
      _luoMP.connected = true;
      notify("🤝 Connected", "Peer joined: " + (_luoMP.peerName||"unknown"), "info");
      mpStartCursorBroadcast();
    }
  };
  _luoMP.pc.ondatachannel = e => {
    _luoMP.dc = e.channel;
    mpSetupDC();
  };
}

function mpSetupDC() {
  _luoMP.dc.onopen    = () => { console.log("[MP] data channel open"); };
  _luoMP.dc.onmessage = e => {
    try {
      const m = JSON.parse(e.data);
      mpHandleMessage(m);
    } catch {}
  };
}

function mpHandleMessage(m) {
  if (m.type === "cursor") {
    let c = _luoMP.cursors[m.from];
    if (!c) {
      const el = document.createElement("div");
      el.style.cssText = `position:fixed;width:14px;height:14px;border-radius:50%;background:${m.color||'#10b981'};border:2px solid #fff;transform:translate(-50%,-50%);pointer-events:none;z-index:99990;box-shadow:0 0 12px ${m.color||'#10b981'}`;
      const lbl = document.createElement("div");
      lbl.textContent = m.from;
      lbl.style.cssText = `position:absolute;left:14px;top:14px;background:${m.color||'#10b981'};color:#fff;padding:2px 6px;border-radius:4px;font-size:9px;white-space:nowrap;font-family:monospace`;
      el.appendChild(lbl);
      document.body.appendChild(el);
      _luoMP.cursors[m.from] = { x:0, y:0, el };
      c = _luoMP.cursors[m.from];
    }
    c.el.style.left = m.x + "px";
    c.el.style.top  = m.y + "px";
  } else if (m.type === "chat") {
    notify("💬 " + m.from, m.text, "info");
  } else if (m.type === "draw") {
    mpRemoteDraw(m);
  }
}

async function mpHost() {
  await mpInit();
  _luoMP.isHost = true;
  _luoMP.myName = prompt("Your name:", "Host") || "Host";
  _luoMP.dc = _luoMP.pc.createDataChannel("luo");
  mpSetupDC();
  const offer = await _luoMP.pc.createOffer();
  await _luoMP.pc.setLocalDescription(offer);
  await new Promise(r => _luoMP.pc.onicecandidate = e => !e.candidate && r());
  const code = btoa(JSON.stringify(_luoMP.pc.localDescription));
  prompt("Share this invite code with your peer (they paste it in 'Join'):", code);
  const answer = prompt("After they share their answer code, paste it here:");
  if (answer) {
    await _luoMP.pc.setRemoteDescription(JSON.parse(atob(answer)));
  }
}

async function mpJoin() {
  await mpInit();
  _luoMP.myName = prompt("Your name:", "Peer") || "Peer";
  const offerCode = prompt("Paste the host's invite code:");
  if (!offerCode) return;
  await _luoMP.pc.setRemoteDescription(JSON.parse(atob(offerCode)));
  const answer = await _luoMP.pc.createAnswer();
  await _luoMP.pc.setLocalDescription(answer);
  await new Promise(r => _luoMP.pc.onicecandidate = e => !e.candidate && r());
  const code = btoa(JSON.stringify(_luoMP.pc.localDescription));
  prompt("Share this answer code with the host:", code);
}

function mpSend(obj) {
  if (_luoMP.dc?.readyState === "open") {
    _luoMP.dc.send(JSON.stringify(obj));
  }
}

let _lastCursorBroadcast = 0;
function mpStartCursorBroadcast() {
  document.addEventListener("mousemove", e => {
    const now = performance.now();
    if (now - _lastCursorBroadcast < 50) return;
    _lastCursorBroadcast = now;
    mpSend({
      type: "cursor",
      from: _luoMP.myName,
      x:    e.clientX,
      y:    e.clientY,
      color: "#10b981"
    });
  });
}

function mpChat() {
  const text = prompt("Message to peer:");
  if (!text) return;
  mpSend({type:"chat", from:_luoMP.myName, text});
  notify("💬 You → " + (_luoMP.peerName||"peer"), text, "info");
}

function mpDisconnect() {
  if (_luoMP.dc) _luoMP.dc.close();
  if (_luoMP.pc) _luoMP.pc.close();
  Object.values(_luoMP.cursors).forEach(c => c.el?.remove());
  _luoMP.pc = null; _luoMP.dc = null; _luoMP.connected = false; _luoMP.cursors = {};
  notify("🔌 Disconnected", "Multiplayer session ended", "info");
}

function mpRemoteDraw(m) {
  // Render a remote drawing event (for shared whiteboard later)
  const dot = document.createElement("div");
  dot.style.cssText = `position:fixed;left:${m.x}px;top:${m.y}px;width:8px;height:8px;border-radius:50%;background:${m.color};pointer-events:none;z-index:99989;box-shadow:0 0 12px ${m.color}`;
  document.body.appendChild(dot);
  setTimeout(()=>dot.remove(), 2000);
}

// ═══════════════════════════════════════════════════════════════
// PILLAR 8 — LUO SOVEREIGN (fully local AI in the browser)
// Speech, embeddings, all run client-side via Transformers.js
// ═══════════════════════════════════════════════════════════════

// ── LOCAL STT: Web Speech API (built-in, no install) ─────────────
let _luoSTT = null;
function luoSTTStart(callback) {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { notify("STT", "Speech recognition not supported", "error"); return; }
  if (_luoSTT) { _luoSTT.stop(); _luoSTT = null; return; }
  _luoSTT = new SR();
  _luoSTT.continuous = true;
  _luoSTT.interimResults = true;
  _luoSTT.lang = "en-US";
  _luoSTT.onresult = e => {
    const r = e.results[e.results.length - 1];
    if (r.isFinal && callback) callback(r[0].transcript.trim());
  };
  _luoSTT.start();
  notify("🎙 Listening", "Speak now...", "info");
}

function luoSTTStop() {
  if (_luoSTT) { _luoSTT.stop(); _luoSTT = null; }
}

// ── LOCAL TTS: Web Speech API (offline on most platforms) ─────────
function luoTTS(text, opts={}) {
  if (!window.speechSynthesis) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.rate   = opts.rate || 1.0;
  u.pitch  = opts.pitch || 1.0;
  u.volume = opts.volume || 1.0;
  // Pick a voice
  const voices = speechSynthesis.getVoices();
  const eng = voices.find(v => v.lang.startsWith("en") && v.name.includes("Google")) ||
              voices.find(v => v.lang.startsWith("en"));
  if (eng) u.voice = eng;
  speechSynthesis.speak(u);
}

// Speak LUOKAI responses automatically when voice mode is on
let _luoVoiceMode = false;
function luoToggleVoiceMode() {
  _luoVoiceMode = !_luoVoiceMode;
  notify(_luoVoiceMode ? "🔊 Voice ON" : "🔇 Voice OFF",
         _luoVoiceMode ? "LUOKAI will speak responses" : "Silent mode",
         "info");
  if (_luoVoiceMode) {
    luoSTTStart(text => {
      // Send to LUOKAI
      fetch(`${API}/api/chat`, {method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({message:text})}).then(r=>r.json()).then(d=>{
        if (d.response) luoTTS(d.response.slice(0,400));
      });
    });
  } else {
    luoSTTStop();
  }
}

// ── LOCAL SEMANTIC SEARCH (Transformers.js + GTE-small ONNX) ─────
let _embedPipeline = null;
async function luoEmbed(text) {
  if (!_embedPipeline) {
    try {
      const transformers = await import("https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2");
      transformers.env.allowLocalModels = false;
      _embedPipeline = await transformers.pipeline("feature-extraction", "Xenova/all-MiniLM-L6-v2");
    } catch(e) {
      console.error("Failed to load embedding model:", e);
      return null;
    }
  }
  try {
    const result = await _embedPipeline(text, { pooling: "mean", normalize: true });
    return Array.from(result.data);
  } catch(e) { return null; }
}

// Cosine similarity
function luoCosine(a, b) {
  let dot = 0;
  for (let i = 0; i < a.length; i++) dot += a[i] * b[i];
  return dot;  // both normalized so this IS cosine
}

// Semantic search across LuoOS notes + chat history
async function luoSemanticSearch(query, items) {
  notify("🧠 Embedding...", "Building vectors locally", "info");
  const queryVec = await luoEmbed(query);
  if (!queryVec) return [];
  const scored = [];
  for (const item of items) {
    const itemVec = await luoEmbed(item.text || item.body || item.content || "");
    if (itemVec) {
      scored.push({ item, score: luoCosine(queryVec, itemVec) });
    }
  }
  scored.sort((a, b) => b.score - a.score);
  return scored.slice(0, 10);
}

// ── LOCAL SOVEREIGN APP ──────────────────────────────────────────
function luoSearchAllSemantic() {
  const q = prompt("Semantic search across all your data (notes, chat history):");
  if (!q) return;
  notify("🧠 Loading embedding model...", "First search takes ~10s, then instant", "info");
  // Gather data
  const notes  = Object.entries(_notes||{}).map(([k,v]) => ({source:"note", text:k+": "+(v.body||""), title:k}));
  const events = Object.entries(_calEvents||{}).flatMap(([k,vs]) => vs.map(v => ({source:"calendar", text:v, date:k})));
  const items = [...notes, ...events];
  if (!items.length) { notify("Nothing to search", "Add some notes first", "info"); return; }
  luoSemanticSearch(q, items).then(results => {
    if (!results.length) { notify("No matches", "", "info"); return; }
    const log = "🧠 Top matches for: " + q + "\n\n" +
      results.slice(0, 5).map((r, i) =>
        `${i+1}. [${r.item.source}] ${(r.item.title||r.item.text).slice(0,80)} (${(r.score*100).toFixed(0)}%)`
      ).join("\n");
    notify("🧠 Results", log, "info");
    console.log("[Sovereign Search]", results);
  });
}

// ═══════════════════════════════════════════════════════════════════
// LUOKAI LIVING SUBSTRATE — UI side
// Every UI action publishes to the bus. LUOKAI sees everything.
// ═══════════════════════════════════════════════════════════════════
async function luoPublish(eventType, data = {}, source = "ui") {
  // Fire-and-forget — never blocks UI
  try {
    fetch(`${API}/api/living/publish`, {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({type: eventType, data, source}),
      keepalive: true,
    }).catch(()=>{});
  } catch(e) {}
}

// Hook openApp to publish app.opened / app.focused
const _origOpenApp = typeof openApp === "function" ? openApp : null;
window.openApp = function(id) {
  luoPublish("app.opened", {app: id});
  luoPublish("app.focused", {app: id});
  if (_origOpenApp) return _origOpenApp(id);
};

// Hook minimizeApp to publish app.closed
const _origMinimizeApp = typeof minimizeApp === "function" ? minimizeApp : null;
window.minimizeApp = function(id) {
  luoPublish("app.closed", {app: id});
  if (_origMinimizeApp) return _origMinimizeApp(id);
};

// Hook browser navigation
const _origBrowserLoad = typeof browserLoad === "function" ? browserLoad : null;
window.browserLoad = function(url) {
  luoPublish("browser.navigate", {url});
  if (_origBrowserLoad) return _origBrowserLoad(url);
};

// Hook file operations
const _origFilesOpen = typeof filesOpen === "function" ? filesOpen : null;
window.filesOpen = function(path) {
  luoPublish("file.opened", {path, app: "files"});
  if (_origFilesOpen) return _origFilesOpen(path);
};

const _origFilesNav = typeof filesNav === "function" ? filesNav : null;
window.filesNav = function(path) {
  luoPublish("file.navigated", {path});
  if (_origFilesNav) return _origFilesNav(path);
};

// Hook note save
const _origNoteSave = typeof noteSave === "function" ? noteSave : null;
window.noteSave = function() {
  if (_origNoteSave) _origNoteSave();
  const body = document.getElementById("note-body")?.value || "";
  luoPublish("note.updated", {title: _currentNote, content: body.slice(0, 500)});
};

// Hook calendar event
const _origCalAddEvent = typeof calAddEvent === "function" ? calAddEvent : null;
window.calAddEvent = function(key) {
  if (_origCalAddEvent) _origCalAddEvent(key);
  luoPublish("calendar.event_added", {date: key});
};

// Hook perception events (from face tracker iframe)
const _origMsgListener = window.addEventListener;
window.addEventListener("message", function(e) {
  if (!e.data) return;
  // Forward perception events to the bus
  if (e.data._luoFaceEvent) {
    if (e.data.type === "GAZE_UPDATE") {
      if (e.data.mood)        luoPublish("perception.mood_change", {mood: e.data.mood});
      if (e.data.attention)   luoPublish("perception.attention", {attention: e.data.attention});
      if (e.data.bpm)         luoPublish("perception.bpm", {bpm: e.data.bpm});
    }
  }
  // Forward hand events
  if (e.data._luoHandEvent && e.data.gesture) {
    luoPublish("gesture", {gesture: e.data.gesture, type: e.data.type});
  }
});

// ── LIVE WORKING MEMORY HUD ─────────────────────────────────────
// A tiny status display showing what LUOKAI knows about the user RIGHT NOW
let _luoMemHud = null;
let _luoMemHudInterval = null;

function luoMemHudShow() {
  if (_luoMemHud) { luoMemHudHide(); return; }
  _luoMemHud = document.createElement("div");
  _luoMemHud.id = "luo-mem-hud";
  _luoMemHud.style.cssText = `
    position:fixed; bottom:50px; right:16px; width:280px;
    background:rgba(8,12,18,.92); backdrop-filter:blur(14px);
    border:1px solid rgba(0,212,255,.3); border-radius:10px;
    padding:14px 16px; font-family:monospace; font-size:11px;
    color:var(--text2); z-index:9985; line-height:1.7;
    box-shadow:0 12px 40px rgba(0,0,0,.6);
    max-height:340px; overflow-y:auto;
  `;
  _luoMemHud.innerHTML = `
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px;border-bottom:1px solid rgba(0,212,255,.2);padding-bottom:8px">
      <span style="font-size:16px">✨</span>
      <span style="color:#4fc3f7;font-weight:700">LUOKAI knows</span>
      <span style="margin-left:auto;cursor:pointer;color:var(--text3)" onclick="luoMemHudHide()">✕</span>
    </div>
    <div id="luo-mem-content">Loading...</div>
  `;
  document.body.appendChild(_luoMemHud);
  luoMemHudRefresh();
  _luoMemHudInterval = setInterval(luoMemHudRefresh, 5000);
}

function luoMemHudHide() {
  if (_luoMemHud) { _luoMemHud.remove(); _luoMemHud = null; }
  if (_luoMemHudInterval) { clearInterval(_luoMemHudInterval); _luoMemHudInterval = null; }
}

async function luoMemHudRefresh() {
  if (!_luoMemHud) return;
  try {
    const r = await fetch(`${API}/api/living/memory`);
    const d = await r.json();
    if (!d.ok) return;
    const m = d.memory;
    const cur = m.current_focus  || "—";
    const task = m.current_task  || "—";
    const apps = (m.open_apps   || []).slice(0,4).join(", ") || "—";
    const topics = (m.recent_topics || []).slice(0,5).join(", ") || "—";
    const mood = m.user_state?.mood || "—";
    const events = m.events_processed || 0;
    document.getElementById("luo-mem-content").innerHTML = `
      <div><span style="color:var(--text3)">focus:</span> <span style="color:var(--accent3)">${cur}</span></div>
      <div><span style="color:var(--text3)">task:</span>  <span style="color:var(--accent2)">${task}</span></div>
      <div><span style="color:var(--text3)">apps:</span>  <span style="color:var(--text)">${apps}</span></div>
      <div><span style="color:var(--text3)">topics:</span> <span style="color:#fbbf24">${topics}</span></div>
      <div><span style="color:var(--text3)">mood:</span>  <span style="color:#ff6b6b">${mood}</span></div>
      <div style="margin-top:8px;padding-top:6px;border-top:1px solid rgba(255,255,255,.05);color:var(--text3);font-size:10px">
        ${events} events processed · daemon alive
      </div>
    `;
  } catch(e) {}
}

// Add HUD toggle button to taskbar (✨ icon)
function _addLivingButton() {
  const tb = document.querySelector("#tb-right") || document.querySelector("#taskbar");
  if (!tb || document.getElementById("tb-living-btn")) return;
  const btn = document.createElement("button");
  btn.id = "tb-living-btn";
  btn.onclick = luoMemHudShow;
  btn.title = "LUOKAI's awareness — what he knows right now";
  btn.style.cssText = "background:none;border:1px solid var(--border);color:var(--accent);padding:2px 8px;border-radius:5px;font-size:10px;cursor:pointer;font-family:var(--font-main)";
  btn.innerHTML = "✨ alive";
  tb.insertBefore(btn, tb.firstChild);
}
setTimeout(_addLivingButton, 1500);
